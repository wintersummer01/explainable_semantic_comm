experiment_name: swin_awgn10_cbr1o12
seed: 1030
loss_type: MSE
epochs: 500
clip_max_norm: 1.0
model:
  type: SwinJSCC
  SNRdB: 10
  spp: 0.25
  dims: [128, 192, 256, 320]
  img_shape: [256, 256]
  patch_shape: [2, 2]
  window_size: 8
  head_dim: 32
optimizer:
  learning_rate: 1.0e-4
  lr_milestone_epoch: []
  lr_gamma: 0.1
dataset:
  train_root: data/imagenette2/train
  valid_root: data/imagenette2/val
  image_size: 256
  train_batch_size: 16
  valid_batch_size: 16
  num_workers: 8
logging:
  save_dir: logs
