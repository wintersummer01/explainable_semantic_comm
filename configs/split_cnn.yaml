experiment_name: split_cnn_awgn5
seed: 1030
loss_type: MSE
epochs: 500
clip_max_norm: 1.0
model:
  type: SwinJSCC_split_CNN
  SNRdB: 5
  spp: 0.25
  dim: 384
  img_shape: [256, 256]
  channel_type: AWGN
  k_factor: 1.0
optimizer:
  learning_rate: 1.0e-4
  lr_milestone_epoch: []
  lr_gamma: 0.1
dataset:
  train_root: data/imagenette2/train
  valid_root: data/imagenette2/val
  image_size: 256
  train_batch_size: 16
  valid_batch_size: 16
  num_workers: 8
logging:
  save_dir: logs
